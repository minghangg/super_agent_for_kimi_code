[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "super-agent"
version = "0.1.0"
description = "Deterministic task automation and memory outsourcing for a single-operator agent team."
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[tool.setuptools]
packages = ["super_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `backup/` holds dated snapshots of earlier suites, not live tests. Without
# this, `python -m pytest` from the repo root collects them too and reports
# 17 failures that belong to history, which buries the one real failure.
norecursedirs = ["backup", ".git", "node_modules", ".venv", "__pycache__"]
